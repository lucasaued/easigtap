[project]
name = "easigtap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2,<3", "alembic>=1.13,<2", "openpyxl>=3.1,<4", "psycopg[binary]>=3,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
